<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4254">
  <title>登录 · 硬件物料台账</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="css/base.css?v=20261121f">
  <link rel="stylesheet" href="css/login.css?v=20261121f">
  <script>
  (function () {
    function showBootError(message) {
      var box = document.getElementById('loginError');
      if (!box) return;
      box.textContent = message;
      box.hidden = false;
    }
    window.addEventListener('error', function (event) {
      if (event && event.message) showBootError('页面脚本加载失败：' + event.message + '（请 Ctrl+F5 强制刷新）');
    }, true);
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event && event.reason ? (event.reason.message || String(event.reason)) : '未知错误';
      showBootError('页面运行异常：' + reason);
    });
    window.addEventListener('DOMContentLoaded', function () {
      if (!window.ERP || !window.ERP.api || !window.ERP.store || !window.ERP.ui) {
        showBootError('前端资源未加载完整（可能被代理/浏览器缓存了旧文件），请 Ctrl+F5 强制刷新后重试');
      }
    });
  })();
  </script>
</head>
<body class="login-body">
  <main class="login-page">
    <!-- 左侧品牌区 -->
    <section class="login-brand">
      <div class="login-brand-inner">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="10" y="10" width="28" height="28" rx="6"></rect>
            <path d="M18 4v6M30 4v6M18 38v6M30 38v6M4 18h6M4 30h6M38 18h6M38 30h6"></path>
            <circle cx="24" cy="24" r="4"></circle>
          </svg>
        </div>
        <div>
          <h1>硬件物料台账</h1>
          <p class="brand-sub">校内硬件社团 · 轻量化 ERP</p>
        </div>
        <ul class="brand-points">
          <li>
            <span class="idx">01</span>
            <div>
              <strong>双模式库存</strong>
              <span class="desc">海量小件记状态，稀缺器件记数量</span>
            </div>
          </li>
          <li>
            <span class="idx">02</span>
            <div>
              <strong>领用全留痕</strong>
              <span class="desc">每次领用自动生成日志，永久可查</span>
            </div>
          </li>
          <li>
            <span class="idx">03</span>
            <div>
              <strong>轻量可离线</strong>
              <span class="desc">纯静态页面，树莓派本地部署</span>
            </div>
          </li>
        </ul>
      </div>
      <div class="brand-foot">HARDWARE INVENTORY · <span id="loginVersion">v1.2.5</span></div>
    </section>

    <!-- 右侧登录面板 -->
    <section class="login-panel">
      <form class="login-card" id="loginForm" autocomplete="off" novalidate>
        <h2>账号登录</h2>
        <p class="login-desc">使用社团账号登录，角色与权限由后端统一校验</p>

        <div class="login-fields">
          <div class="field">
            <label class="label" for="loginAccount">账号</label>
            <input class="input" id="loginAccount" name="account" type="text"
                   placeholder="请输入社团账号" autocomplete="username" required>
          </div>
          <div class="field">
            <label class="label" for="loginPassword">密码</label>
            <input class="input" id="loginPassword" name="password" type="password"
                   placeholder="请输入密码" autocomplete="current-password" required>
          </div>
        </div>

        <div class="login-error" id="loginError" role="alert" hidden></div>

        <div class="login-actions">
          <button class="btn btn-primary btn-block" id="loginBtn" type="submit">登 录</button>
        </div>

        <div class="login-session" id="loginSession" hidden>
          <span id="loginSessionText"></span>
          <span class="flex">
            <a href="dashboard.html" id="loginContinue">进入系统</a>
            <button type="button" class="btn-link" id="loginSignOut">退出</button>
          </span>
        </div>

        <p class="login-note">
          账号由超级管理员在「用户管理」中创建；登录成功后使用 JWT 令牌访问后端接口，
          页面数据全部来自 MariaDB，不再使用浏览器模拟数据。
        </p>
      </form>
    </section>
  </main>

  <script src="js/config.js?v=20261121f"></script>
  <script src="js/icons.js?v=20261121f"></script>
  <script src="js/auth.js?v=20261121f"></script>
  <script src="js/api.js?v=20261121f"></script>
  <script src="js/store.js?v=20261121f"></script>
  <script src="js/ui.js?v=20261121f"></script>
  <script src="js/login.js?v=20261121f"></script>
  <script src="js/dev-reload.js?v=20261121f"></script>
</body>
</html>
