<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4254">
  <title>登录 · 硬件物料台账</title>
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">
  <main class="login-page">
    <!-- 左侧品牌区 -->
    <section class="login-brand">
      <div class="login-brand-inner">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="10" y="10" width="28" height="28" rx="6"></rect>
            <path d="M18 4v6M30 4v6M18 38v6M30 38v6M4 18h6M4 30h6M38 18h6M38 30h6"></path>
            <circle cx="24" cy="24" r="4"></circle>
          </svg>
        </div>
        <div>
          <h1>硬件物料台账</h1>
          <p class="brand-sub">校内硬件社团 · 轻量化 ERP</p>
        </div>
        <ul class="brand-points">
          <li>
            <span class="idx">01</span>
            <div>
              <strong>双模式库存</strong>
              <span class="desc">海量小件记状态，稀缺器件记数量</span>
            </div>
          </li>
          <li>
            <span class="idx">02</span>
            <div>
              <strong>领用全留痕</strong>
              <span class="desc">每次领用自动生成日志，永久可查</span>
            </div>
          </li>
          <li>
            <span class="idx">03</span>
            <div>
              <strong>轻量可离线</strong>
              <span class="desc">纯静态页面，树莓派本地部署</span>
            </div>
          </li>
        </ul>
      </div>
      <div class="brand-foot">HARDWARE INVENTORY · v0.1.0</div>
    </section>

    <!-- 右侧登录面板 -->
    <section class="login-panel">
      <form class="login-card" id="loginForm" autocomplete="off" novalidate>
        <h2>账号登录</h2>
        <p class="login-desc">请选择登录角色并输入账号密码</p>

        <div class="login-fields">
          <div class="field">
            <label class="label" for="loginAccount">账号</label>
            <input class="input" id="loginAccount" name="account" type="text"
                   placeholder="请输入社团账号" autocomplete="username" required>
          </div>
          <div class="field">
            <label class="label" for="loginPassword">密码</label>
            <input class="input" id="loginPassword" name="password" type="password"
                   placeholder="请输入密码" autocomplete="current-password" required>
          </div>
          <div class="field">
            <span class="label">登录角色</span>
            <div class="role-picker" role="group" aria-label="登录角色">
              <button type="button" class="role-option" data-role="super" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 8l4 3 5-6 5 6 4-3-2 11H5L3 8Z"></path>
                </svg>
                超级管理员
              </button>
              <button type="button" class="role-option" data-role="admin" aria-pressed="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 22s8-3.6 8-9.5V5.5L12 2 4 5.5v7C4 18.4 12 22 12 22Z"></path>
                  <path d="m9 12 2 2 4-4"></path>
                </svg>
                管理员
              </button>
              <button type="button" class="role-option" data-role="member" aria-pressed="false">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                普通成员
              </button>
            </div>
            <span class="field-hint">角色仅用于前端演示，真实权限由后端校验。</span>
          </div>
        </div>

        <div class="login-error" id="loginError" role="alert" hidden></div>

        <div class="login-actions">
          <button class="btn btn-primary btn-block" id="loginBtn" type="submit">登 录</button>
        </div>

        <div class="login-session" id="loginSession" hidden>
          <span id="loginSessionText"></span>
          <span class="flex">
            <a href="dashboard.html" id="loginContinue">进入系统</a>
            <button type="button" class="btn-link" id="loginSignOut">退出</button>
          </span>
        </div>

        <div class="demo-box">
          <div class="demo-title">演示账号（点击填入）</div>
          <div class="demo-row">
            <button type="button" class="demo-chip" data-role="super"
                    data-account="superadmin" data-password="super123">superadmin / super123 · 超管</button>
            <button type="button" class="demo-chip" data-role="admin"
                    data-account="admin" data-password="admin123">admin / admin123 · 管理员</button>
            <button type="button" class="demo-chip" data-role="member"
                    data-account="member" data-password="member123">member / member123 · 成员</button>
          </div>
        </div>

        <p class="login-note">
          当前为纯前端演示版本：密码校验与权限控制将在后续由后端实现，
          此处仅通过角色切换模拟登录身份。
        </p>
      </form>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
  <script src="js/dev-reload.js"></script>
</body>
</html>
