# =====================================================================
# Linda_ERP Nginx 站点配置（ARM64 Ubuntu 24.04 / 宿主机 Nginx）
# 说明：
# - 前端为原生静态 HTML，直接由 Nginx 托管，无需构建
# - /api/ 反向代理到 127.0.0.1:8000（后端只监听回环地址）
# - 不需要 WebSocket；文件上传上限 10MB，常规超时 60s
# - 部署脚本会用实际项目路径替换 __PROJECT_DIR__
# =====================================================================

server {
    listen 80;
    server_name __SERVER_NAME__;

    charset utf-8;
    root __PROJECT_DIR__/frontend;
    index login.html;

    # 上传大小限制（与后端 MAX_UPLOAD_MB 保持一致）
    client_max_body_size 10m;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API 反向代理（无 WebSocket）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # 上传的物料图片（持久化目录）
    location /uploads/ {
        alias __PROJECT_DIR__/data/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # 静态资源缓存
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # 前端页面
    location / {
        try_files $uri $uri/ /login.html;
    }

    access_log /var/log/nginx/linda_erp_access.log;
    error_log  /var/log/nginx/linda_erp_error.log warn;
}
