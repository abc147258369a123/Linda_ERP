# =====================================================================
# Linda_ERP 前端静态站点 + API 反向代理（Nginx 容器，host 网络）
# 监听 8088，避开宿主机已有的 Nginx Proxy Manager（80/443/81）
# =====================================================================

server {
    listen 8088 default_server;
    server_name _;

    charset utf-8;
    root /usr/share/nginx/html;
    index login.html;

    client_max_body_size 10m;

    # 默认禁止缓存 HTML/API，避免部署后浏览器或代理继续使用旧页面
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # API 反向代理：后端只监听宿主机 127.0.0.1:8000（web 使用 host 网络）
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # 上传的物料图片（持久化目录）
    location /uploads/ {
        alias /data/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # 前端 JS/CSS：必须重新校验；文件 URL 已带 ?v= 构建版本
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|gif|ico|woff2?)$ {
        expires off;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /login.html;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
